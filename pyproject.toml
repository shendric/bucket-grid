[build-system]
requires = ["cython", "setuptools", "numpy", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bucket_grid"
description = "Drop-in-the-bucket gridding and analysis method for multi-variate geospatial data."
readme = "README.md"
version = "0.1"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = []
authors = [
  { name = "Stefan Hendricks", email = "stefan.hendricks@awi.de" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "loguru",
    "numpy",
    "tomli;python_version<'3.11'",
    "xarray",
]

[project.optional-dependencies]

dev = [
    "flake8",
    "isort",
    "mypy",
    "matplotlib",
    "pytest",
    "coverage",
]

[project.urls]
Homepage = "https://github.com/pysiral/bucket-grid"
Documentation = "https://bucket-grid.readthedocs.io"
Issues = "https://github.com/pysiral/bucket-grid/issues"
Source = "https://github.com/pysiral/bucket-grid"
